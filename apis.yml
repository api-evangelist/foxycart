aid: foxycart
name: Foxy.io
description: >
  Foxy.io (formerly FoxyCart) is a developer-focused shopping cart and e-commerce
  platform providing a hosted hypermedia REST API (hAPI) for managing products,
  customers, subscriptions, transactions, and order workflows. The platform supports
  physical products, digital goods, subscriptions, donations, and services, and
  integrates with 100+ payment gateways including Stripe, PayPal, and Square.
  The API uses HATEOAS design with OAuth 2.0 authentication and has processed
  over $3 billion in transactions globally.
