apis:
  - aid: foxycart:foxycart-hapi
    name: Foxy hAPI
    description: >
      The Foxy Hypermedia API (hAPI) is a RESTful hypermedia API implementing
      HATEOAS design, giving developers complete control over Foxy store accounts.
      Supports managing stores, customers, transactions, subscriptions, coupons,
      shipping, payment methods, templates, and webhooks. Provides both production
      and sandbox environments.
